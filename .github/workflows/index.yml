name: Index

# Rebuilds the catalog from awesome-tuis and publishes it on the orphan
# `index` branch, which is what the client downloads.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --profile indexer --locked -p tuiman-indexer -- --out dist

      - name: Publish to the index branch
        run: |
          cd dist
          git init --quiet --initial-branch=index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.bin index.json
          git commit --quiet --message "index: $(date --utc +%F)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" index

name: Release

# On a `v*` tag: builds tuiman for Linux (static musl) and macOS, creates the
# GitHub release and uploads the tarballs with a SHA256SUMS file and build
# provenance attestations, publishes the crates to crates.io, then updates the
# Homebrew tap.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: grep -qx "version = \"${VERSION#v}\"" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p tuiman --target ${{ matrix.target }}
      # Layout matches cargo-binstall's defaults, so `cargo binstall tuiman` finds it.
      - name: Package
        run: |
          name="tuiman-${{ matrix.target }}-$VERSION"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/tuiman" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Notes list the commit subjects since the previous tag; GitHub's
        # --generate-notes only lists merged PRs, and most changes land on main.
        run: |
          prev=$(git describe --tags --abbrev=0 "$VERSION^")
          {
            echo "## What's Changed"
            git log --pretty='- %s' "$prev..$VERSION" | grep -v '^- chore(release)'
            echo
            echo "**Full Changelog**: https://github.com/$GH_REPO/compare/$prev...$VERSION"
          } > notes.md
          gh release view "$VERSION" >/dev/null 2>&1 ||
            gh release create "$VERSION" --verify-tag --notes-file notes.md
          gh release upload "$VERSION" dist/* --clobber

  # Publishes tuiman-index and tuiman to crates.io via trusted publishing
  # (configured per crate on crates.io for this repo and release.yml).
  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Fills pkg/tuiman.rb from SHA256SUMS and pushes it to the tap. Needs the
  # HOMEBREW_TAP_TOKEN secret (contents: write on danctorres/homebrew-tap).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -p SHA256SUMS
          mkdir out
          pkg/render.sh "$VERSION" SHA256SUMS pkg/tuiman.rb > out/tuiman.rb
      - uses: actions/checkout@v4
        with:
          repository: danctorres/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push Homebrew formula
        run: |
          mkdir -p tap/Formula
          cp out/tuiman.rb tap/Formula/
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/tuiman.rb
          git diff --cached --quiet && exit  # re-run of the same release
          git commit -m "feat: update tuiman to ${VERSION#v}"
          git push

name: Release

# On a `v*` tag: builds tuiman for Linux (static musl) and macOS, creates the
# GitHub release and uploads the tarballs with a SHA256SUMS file and build
# provenance attestations.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p tuiman --target ${{ matrix.target }}
      # Layout matches cargo-binstall's defaults, so `cargo binstall tuiman` finds it.
      - name: Package
        run: |
          name="tuiman-${{ matrix.target }}-$VERSION"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/tuiman" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 ||
            gh release create "$VERSION" --verify-tag --generate-notes
          gh release upload "$VERSION" dist/* --clobber

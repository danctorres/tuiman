[workspace]
resolver = "2"
members = ["crates/tuiman-index", "crates/tuiman", "crates/tuiman-indexer"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danctorres/tuiman"
rust-version = "1.85"

# `cargo release patch --execute`: bumps, commits, tags vX.Y.Z and pushes;
# the Release workflow publishes to crates.io.
[workspace.metadata.release]
shared-version = true
publish = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The indexer parses ~100 MB of JSON, so it wants optimisation, but it spends
# minutes waiting on the network: whole-program LTO would only slow CI down.
[profile.indexer]
inherits = "release"
lto = false
codegen-units = 16
